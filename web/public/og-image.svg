<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Writers' Room — your AI crew argues, you direct. Powered by IBM Granite.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#180A10"/>
      <stop offset="0.55" stop-color="#12060B"/>
      <stop offset="1" stop-color="#0c0408"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.15" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#F43F5E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.9" cy="1" r="0.7">
      <stop offset="0" stop-color="#9f1239" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FB7185" fill-opacity="0.16"/>
    </pattern>
    <radialGradient id="dotmask" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1200" height="630" fill="url(#dotmask)"/></mask>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowTL)"/>
  <rect width="1200" height="630" fill="url(#glowBR)"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#fade)"/>

  <!-- Left: copy -->
  <g font-family="ui-monospace, 'Courier New', monospace">
    <text x="84" y="232" font-size="22" letter-spacing="7" fill="#fda4af" fill-opacity="0.9">INT. THE WRITERS&#8217; ROOM</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="80" y="322" font-size="72" font-weight="800" fill="#FFF1F2">The Writers&#8217; Room</text>
    <text x="84" y="378" font-size="27" font-weight="500" fill="#fecdd3" fill-opacity="0.82">Your AI crew argues. You direct.</text>
  </g>

  <!-- IBM Granite pill -->
  <g transform="translate(84,420)">
    <rect width="252" height="48" rx="24" fill="#F43F5E" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.5"/>
    <circle cx="28" cy="24" r="5.5" fill="#FB7185"/>
    <text x="48" y="31" font-family="ui-monospace, 'Courier New', monospace" font-size="18" letter-spacing="2.5" fill="#fecdd3">POWERED BY IBM GRANITE</text>
  </g>

  <!-- Right: the crew as a connected fan-out constellation -->
  <g>
    <g stroke="#FB7185" stroke-opacity="0.28" stroke-width="2">
      <line x1="940" y1="315" x2="940" y2="165"/>
      <line x1="940" y1="315" x2="1070" y2="240"/>
      <line x1="940" y1="315" x2="1070" y2="390"/>
      <line x1="940" y1="315" x2="940" y2="465"/>
      <line x1="940" y1="315" x2="810" y2="390"/>
      <line x1="940" y1="315" x2="810" y2="240"/>
    </g>
    <g filter="url(#soft)">
      <circle cx="940" cy="315" r="26" fill="#00F0FF"/>
      <circle cx="940" cy="165" r="20" fill="#FF6B35"/>
      <circle cx="1070" cy="240" r="20" fill="#FF2A6D"/>
      <circle cx="1070" cy="390" r="20" fill="#FFCC00"/>
      <circle cx="940" cy="465" r="20" fill="#4FC3F7"/>
      <circle cx="810" cy="390" r="20" fill="#B388FF"/>
      <circle cx="810" cy="240" r="20" fill="#05D582"/>
    </g>
    <text x="940" y="548" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#fda4af" fill-opacity="0.7">7 specialist agents &#183; one room</text>
  </g>
</svg>
