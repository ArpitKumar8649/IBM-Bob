[project]
name = "writers-room-api"
version = "0.1.0"
description = "The Writers' Room — FastAPI backend serving the AI agent crew (IBM Granite via watsonx.ai / Ollama)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "ibm-watsonx-ai>=1.1.20",
    "sse-starlette>=2.1.3",
    # Orchestration runtime — agent_graph.py imports these directly.
    "langgraph>=0.2.50",
    "langchain-ibm>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
